<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caught locking out · lockedin</title>
<meta name="description" content="Someone got caught locking out on lockedin, the free focus timer that notices when you grab your phone.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Caught locking out 😭">
<meta property="og:description" content="Watch the clip, then try lockedin: the free focus timer that catches you on your phone.">
<meta property="og:image" content="https://calebsamuel1026-blip.github.io/lockedin/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.dataset.theme = "dark";</script>
<style>
  .share { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 18px; justify-items: center; text-align: center; }
  .share .brand { justify-self: start; }
  .share video { width: 100%; border-radius: 22px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.45); aspect-ratio: 4 / 3; object-fit: cover; }
  .share h1 { font: 800 30px/1.1 var(--display); letter-spacing: -.04em; }
  .share p { color: var(--text-2); font-size: 15px; line-height: 1.55; max-width: 400px; }
  .share .cta { width: 100%; max-width: 360px; }
  .share .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<main class="share">
  <a class="brand" href="./"><img src="icon.svg" alt="" width="30" height="30"><span class="wordmark">locked<span>in</span></span></a>
  <video id="vid" autoplay loop muted playsinline controls hidden></video>
  <h1 id="title">Loading the clip…</h1>
  <p id="sub"></p>
  <a class="pill filled lg cta" href="./?ref=clip">Try lockedin free 🔒</a>
  <div class="row">
    <button type="button" class="pill tinted sm" id="copy" hidden>Copy link</button>
  </div>
  <p class="caption">lockedin is a free focus timer. It notices when you pick up your phone, doze off or zone out. Video stays on your device unless you choose to share a clip.</p>
</main>
<script type="module">
import {SUPABASE_URL, SUPABASE_KEY} from "./config.js";
const id = new URLSearchParams(location.search).get("id") || "";
const $ = s => document.querySelector(s);
const fail = () => { $("#title").textContent = "This clip isn't available"; $("#sub").textContent = "It may have been deleted by the person who shared it."; };
if (!/^[a-z0-9]{10}$/.test(id)) fail();
else fetch(`${SUPABASE_URL}/rest/v1/rpc/get_clip`, {
  method: "POST",
  headers: {"Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`},
  body: JSON.stringify({clip_id: id}),
}).then(r => r.ok ? r.json() : []).then(rows => {
  const c = rows[0]; if (!c) return fail();
  const v = $("#vid");
  v.src = `${SUPABASE_URL}/storage/v1/object/public/clips/${c.path.split("/").map(encodeURIComponent).join("/")}`;
  v.hidden = false; v.play().catch(() => {});
  $("#title").textContent = c.caption || "Caught locking out";
  $("#sub").textContent = "Caught on camera by lockedin. Think you'd stay locked in longer?";
  document.title = `${c.caption || "Caught locking out"} · lockedin`;
  $("#copy").hidden = false;
}).catch(fail);
$("#copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("#copy").textContent = "Copied ✓"; } catch { prompt("Copy this link:", location.href); }
};
</script>
</body>
</html>
